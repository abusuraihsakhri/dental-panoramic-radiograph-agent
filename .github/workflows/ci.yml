name: Test and verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]" pip-audit ruff
      - name: Validate dependencies and source
        run: |
          python -m pip check
          ruff check --select E4,E7,E9,F63,F7,F82 agents dent_scan_ai cli.py enrichment.py simulator.py
          pip-audit --progress-spinner off
          python -m compileall -q agents dent_scan_ai cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Test browser rule evaluation
        run: node --test tests/test_web.cjs tests/test_web_dom.cjs
