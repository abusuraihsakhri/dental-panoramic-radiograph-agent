[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-panoramic-radiograph-engine"
version = "2.0.1"
description = "Synthetic dental workflow rule evaluator and FDI notation demonstration"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
dental-panoramic-radiograph-engine = "dent_scan_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dental-panoramic-radiograph-agent"
Repository = "https://github.com/abusuraihsakhri/dental-panoramic-radiograph-agent"

[tool.setuptools.packages.find]
include = ["agents*", "dent_scan_ai*"]
