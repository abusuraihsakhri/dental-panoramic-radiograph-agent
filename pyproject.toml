[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-panoramic-radiograph-engine"
version = "2.0.0"
description = "DentScan-AI: Orthopantomogram (OPG) Tooth Numbering & Caries Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dental-panoramic-radiograph-engine = "dent_scan_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dental-panoramic-radiograph-engine"
Repository = "https://github.com/abusuraihsakhri/dental-panoramic-radiograph-engine.git"
